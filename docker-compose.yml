services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gametracker-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - ConnectionStrings__PostgreSQL=Host=db;Port=5432;Database=gametracker;Username=postgres;Password=${DB_PASSWORD}
      - Services__Weaviate__ApiUrl=http://weaviate:8080/v1/graphql
      - Services__Ollama__Url=http://ollama:11434
    networks:
      - backend
    depends_on:
      - db
      - weaviate
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys

  db:
    image: postgres:latest
    container_name: gametracker-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gametracker
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql-init:/docker-entrypoint-initdb.d
    networks:
      - backend

  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: gametracker-weaviate
    restart: always
    environment:
      ENABLE_MODULES: 'none'
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      CLUSTER_HOSTNAME: "node1"
      DISABLE_TELEMETRY: "true"
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: gametracker-ollama
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - backend

volumes:
  pgdata:
  weaviate_data:
  ollama_data:
  dataprotection_keys:

networks:
  backend:
    driver: bridge